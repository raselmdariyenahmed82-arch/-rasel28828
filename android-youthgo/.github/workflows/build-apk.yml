name: Build YouthGo Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compile Debug APK
        run: gradle assembleDebug

      - name: Verify and package APK_DOWNLOAD
        run: |
          mkdir -p .build-outputs APK_DOWNLOAD
          cp app/build/outputs/apk/debug/app-debug.apk .build-outputs/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk APK_DOWNLOAD/app-debug.apk
          ls -lh APK_DOWNLOAD/app-debug.apk

      - name: Upload YouthGo APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouthGo-app-debug-apk
          path: APK_DOWNLOAD/app-debug.apk
          if-no-files-found: error
